<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2a1c"/>
      <stop offset="55%" stop-color="#7a4f2a"/>
      <stop offset="100%" stop-color="#c07f36"/>
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="62%" r="34%">
      <stop offset="0" stop-color="#f6c46a" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#f6c46a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3524"/>
      <stop offset="100%" stop-color="#2a1d15"/>
    </linearGradient>

    <pattern id="logEnds" width="76" height="76" patternUnits="userSpaceOnUse">
      <rect width="76" height="76" fill="#5b3d24"/>
      <g>
        <circle cx="20" cy="20" r="17" fill="#8b5e34"/>
        <circle cx="20" cy="20" r="11" fill="none" stroke="#a97741" stroke-width="2"/>
        <circle cx="20" cy="20" r="5" fill="none" stroke="#c9944f" stroke-width="2"/>
        <circle cx="58" cy="20" r="16" fill="#7b5230"/>
        <circle cx="58" cy="20" r="9" fill="none" stroke="#a97741" stroke-width="2"/>
        <circle cx="20" cy="58" r="16" fill="#7b5230"/>
        <circle cx="20" cy="58" r="9" fill="none" stroke="#9c6c3c" stroke-width="2"/>
        <circle cx="58" cy="58" r="17" fill="#8b5e34"/>
        <circle cx="58" cy="58" r="11" fill="none" stroke="#c9944f" stroke-width="2"/>
        <circle cx="58" cy="58" r="5" fill="none" stroke="#e0b075" stroke-width="2"/>
      </g>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant ridge -->
  <path d="M0 470 L120 430 L210 462 L330 400 L430 448 L560 392 L690 452 L820 404 L960 456 L1090 410 L1230 460 L1360 418 L1480 458 L1600 424 L1600 620 L0 620 Z" fill="#2f2116" opacity=".85"/>

  <!-- pine belt -->
  <g fill="#241a12" opacity=".92">
    <path d="M60 520l30-96 30 96zM130 528l26-84 26 84zM196 516l32-104 32 104zM272 530l24-80 24 80zM1180 522l30-98 30 98zM1250 530l25-82 25 82zM1316 514l33-106 33 106zM1394 528l26-86 26 86zM1462 520l30-96 30 96z"/>
  </g>

  <rect y="560" width="1600" height="340" fill="url(#ground)"/>

  <!-- stacked log walls -->
  <g>
    <rect x="60" y="392" width="392" height="212" rx="6" fill="url(#logEnds)"/>
    <rect x="60" y="392" width="392" height="212" rx="6" fill="#2a1d15" opacity=".22"/>
    <rect x="52" y="596" width="408" height="16" rx="4" fill="#1f1610"/>

    <rect x="500" y="440" width="300" height="164" rx="6" fill="url(#logEnds)"/>
    <rect x="500" y="440" width="300" height="164" rx="6" fill="#2a1d15" opacity=".1"/>
    <rect x="492" y="596" width="316" height="16" rx="4" fill="#1f1610"/>

    <rect x="1150" y="360" width="404" height="244" rx="6" fill="url(#logEnds)"/>
    <rect x="1150" y="360" width="404" height="244" rx="6" fill="#2a1d15" opacity=".3"/>
    <rect x="1142" y="596" width="420" height="16" rx="4" fill="#1f1610"/>
  </g>

  <!-- loose log pile centre -->
  <g transform="translate(858 500)">
    <g fill="#7b5230" stroke="#4a3220" stroke-width="3">
      <rect x="0" y="72" width="230" height="26" rx="13"/>
      <rect x="18" y="44" width="196" height="26" rx="13"/>
      <rect x="44" y="16" width="150" height="26" rx="13"/>
      <rect x="76" y="-12" width="92" height="26" rx="13"/>
    </g>
    <g fill="#c9944f">
      <circle cx="8" cy="85" r="9"/><circle cx="222" cy="85" r="9"/>
      <circle cx="26" cy="57" r="9"/><circle cx="206" cy="57" r="9"/>
      <circle cx="52" cy="29" r="9"/><circle cx="186" cy="29" r="9"/>
      <circle cx="84" cy="1" r="9"/><circle cx="160" cy="1" r="9"/>
    </g>
  </g>

  <!-- foreground ground haze -->
  <rect y="700" width="1600" height="200" fill="#1c1309" opacity=".55"/>
</svg>
